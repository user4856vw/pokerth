name: PokerTH Trainer Android APK (local-only)

# Place this file into a fork of pokerth/pokerth AFTER applying the kibitzer patch.
# Manual or dedicated-branch build, for sideloading only. Uses the upstream build_android_qml.sh.
# If secrets are absent, signs with a fresh TEST key; that APK will not update
# any prior installation (Android requires the same signing key for updates).
on:
  push:
    branches: ['build/kibitzer-android']
  workflow_dispatch:
    inputs:
      abi:
        description: Android CPU architecture
        required: true
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - armeabi-v7a

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      BUILD_TARGET: pokerth_qml-client
      PACKAGE_FORMAT: apk
      ANDROID_ABIS: ${{ inputs.abi || 'arm64-v8a' }}
      QT_VERSION: 6.9.3
      ANDROID_API_LEVEL: '35'
      ANDROID_MIN_SDK: '28'
      ANDROID_PACKAGE_NAME: net.pokerth.Kibitzer
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      HAS_KEYSTORE: ${{ secrets.KIBITZER_KEYSTORE_BASE64 != '' && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v4
      - name: Verify Qt QML resource manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("src/gui/qt6-qml")
          cmake = (root / "CMakeLists.txt").read_text(encoding="utf-8")
          qrc = (root / "qml.qrc").read_text(encoding="utf-8")
          block = re.search(r"set\(QML_FILES\s*(.*?)\n\)", cmake, re.S)
          if block is None:
              raise SystemExit("QML_FILES not found in CMakeLists.txt")
          listed = set(re.findall(r"^\s*(components/[\w/-]+\.qml)\s*$", block.group(1), re.M))
          embedded = set(re.findall(r"<file>([^<]+)</file>", qrc))
          # These variants are packaged under an alias in svgicon.qrc.in.
          alternate = {"components/SvgIconImage.qml", "components/SvgIconVector.qml"}
          missing = sorted(listed - embedded - alternate)
          if missing:
              raise SystemExit("QML components missing from qml.qrc: " + ", ".join(missing))
          print(f"Verified {len(listed - alternate)} packaged QML components")
          PY
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Restore Qt kit
        uses: actions/cache/restore@v4
        with:
          path: ~/Qt
          key: kibitzer-qt-693-${{ inputs.abi || 'arm64-v8a' }}-${{ github.run_id }}
          restore-keys: |
            kibitzer-qt-693-${{ inputs.abi || 'arm64-v8a' }}-
      - name: Restore vcpkg
        uses: actions/cache/restore@v4
        with:
          path: ~/vcpkg
          key: kibitzer-vcpkg-${{ inputs.abi || 'arm64-v8a' }}-${{ github.run_id }}
          restore-keys: |
            kibitzer-vcpkg-${{ inputs.abi || 'arm64-v8a' }}-
      - name: Restore Gradle cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: kibitzer-gradle-${{ inputs.abi || 'arm64-v8a' }}-${{ github.run_id }}
          restore-keys: |
            kibitzer-gradle-${{ inputs.abi || 'arm64-v8a' }}-
      - name: Prepare signing key
        env:
          KEY_BASE64: ${{ secrets.KIBITZER_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KIBITZER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KIBITZER_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KIBITZER_KEY_PASSWORD }}
        run: |
          if [ "$HAS_KEYSTORE" = 'true' ]; then
            printf '%s' "$KEY_BASE64" | base64 -d > "$RUNNER_TEMP/kibitzer.keystore"
            echo "ANDROID_KEYSTORE_PASS=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASS=${KEY_PASS:-$KEY_PASSWORD}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/kibitzer.keystore" \
              -alias kibitzer -keyalg RSA -keysize 3072 -validity 3650 \
              -storepass temporary-test-key -keypass temporary-test-key \
              -dname 'CN=PokerTH Kibitzer Test,O=Local Build,C=DE'
            echo 'ANDROID_KEYSTORE_PASS=temporary-test-key' >> "$GITHUB_ENV"
            echo 'ANDROID_KEY_ALIAS=kibitzer' >> "$GITHUB_ENV"
            echo 'ANDROID_KEY_PASS=temporary-test-key' >> "$GITHUB_ENV"
            echo 'WARNING: Ephemeral test signing key: uninstall prior Kibitzer builds before installing this APK.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/kibitzer.keystore" >> "$GITHUB_ENV"
      - name: Unit-test review classifier and training statistics
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I src/gui/qt6-qml/cpp \
            tests/kibitzer/test_review.cpp -o /tmp/kibitzer-review-test
          /tmp/kibitzer-review-test
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I src/gui/qt6-qml/cpp \
            tests/kibitzer/test_autoplay.cpp -o /tmp/kibitzer-autoplay-test
          /tmp/kibitzer-autoplay-test
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I src/gui/qt6-qml/cpp \
            tests/kibitzer/test_training_stats.cpp -o /tmp/kibitzer-stats-test
          /tmp/kibitzer-stats-test
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I src/engine/local_engine \
            tests/kibitzer/test_ranges.cpp \
            src/engine/local_engine/holecardsrange.cpp -o /tmp/kibitzer-ranges-test
          /tmp/kibitzer-ranges-test
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I src/gui/qt6-qml/cpp \
            tests/kibitzer/test_aggression.cpp -o /tmp/kibitzer-aggression-test
          /tmp/kibitzer-aggression-test
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I src/gui/qt6-qml/cpp \
            tests/kibitzer/test_tournament_stats.cpp -o /tmp/kibitzer-tournament-test
          /tmp/kibitzer-tournament-test
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I src/gui/qt6-qml/cpp -I src/engine/local_engine \
            tests/kibitzer/test_betsizing.cpp \
            src/engine/local_engine/holecardsrange.cpp \
            -o /tmp/kibitzer-betsizing-test
          /tmp/kibitzer-betsizing-test
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I src/gui/qt6-qml/cpp \
            tests/kibitzer/test_mc_config.cpp -o /tmp/kibitzer-mc-config-test
          /tmp/kibitzer-mc-config-test
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I src/gui/qt6-qml/cpp \
            tests/kibitzer/test_pro_matcher.cpp -o /tmp/kibitzer-pro-matcher-test
          /tmp/kibitzer-pro-matcher-test
          python3 scripts/validate_kibitzer_pro_corpus.py
      - name: Gate APK on preflop policy and P0/V7 incident regressions
        run: |
          set -eu
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I src/gui/qt6-qml/cpp tests/kibitzer/test_preflop_policy.cpp -o /tmp/kibitzer-preflop
          /tmp/kibitzer-preflop
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -I src/gui/qt6-qml/cpp -I src/engine/local_engine \
            tests/kibitzer/test_strategy_p0.cpp src/engine/local_engine/handevaluator.cpp \
            -o /tmp/kibitzer-p0-v7
          /tmp/kibitzer-p0-v7
      - name: Compile and run V8 empirical model and pot-tier regressions
        run: |
          set -eu
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -I src/gui/qt6-qml/cpp -I src/engine/local_engine \
            tests/kibitzer/test_empirical_v8.cpp src/engine/local_engine/handevaluator.cpp \
            -o /tmp/kibitzer-v8
          /tmp/kibitzer-v8
      - name: Build signed APK
        run: |
          export VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          bash build_android_qml.sh
      - name: Save Qt cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Qt
          key: kibitzer-qt-693-${{ inputs.abi || 'arm64-v8a' }}-${{ github.run_id }}
      - name: Save vcpkg cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/vcpkg
          key: kibitzer-vcpkg-${{ inputs.abi || 'arm64-v8a' }}-${{ github.run_id }}
      - name: Save Gradle cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: kibitzer-gradle-${{ inputs.abi || 'arm64-v8a' }}-${{ github.run_id }}
      - name: Upload APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: PokerTH-Kibitzer-${{ inputs.abi || 'arm64-v8a' }}-${{ github.run_number }}
          path: PokerTH-*.apk
          if-no-files-found: error
      - name: Publish verified artifact link
        run: |
          {
            echo '### Signed Kibitzer APK'
            echo 'Source revision: `'"${GITHUB_SHA}"'`'
            echo 'Architecture: `'"${ANDROID_ABIS}"'`'
            echo '[Download APK archive](${{ steps.apk.outputs.artifact-url }})'
          } >> "$GITHUB_STEP_SUMMARY"
