name: Kibitzer AUTO TEST policy checks

on:
  push:
    branches: [feature/kibitzer-eat-own-food-loop, experiment/kibitzer-preflop-ranges-v4]
  pull_request:
    branches: [pokerth-trainer-v3, feature/kibitzer-eat-own-food-loop]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run isolated policy and review tests
        run: |
          set -eu
          for t in autoplay preflop_policy preflop_ranges preflop_position river_defense review aggression tournament_stats mc_config pro_matcher; do
            g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
              -I src/gui/qt6-qml/cpp \
              "tests/kibitzer/test_${t}.cpp" -o "/tmp/kibitzer-${t}"
            "/tmp/kibitzer-${t}"
          done
