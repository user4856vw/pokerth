name: Kibitzer AUTO TEST policy checks

on:
  push:
    branches: [feature/kibitzer-eat-own-food-loop, experiment/kibitzer-preflop-ranges-v4, experiment/kibitzer-evidence-corpus-v5, experiment/kibitzer-strategy-p0-v6, experiment/kibitzer-strategy-p0-v7, experiment/kibitzer-strategy-p0-v8, feature/kibitzer-date-range-export]
  pull_request:
    branches: [pokerth-trainer-v3, feature/kibitzer-eat-own-food-loop, experiment/kibitzer-preflop-ranges-v4, experiment/kibitzer-evidence-corpus-v5]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run isolated policy and review tests
        run: |
          set -eu
          for t in autoplay preflop_policy preflop_ranges preflop_position evidence_open_ranges river_defense review aggression tournament_stats mc_config pro_matcher; do
            g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
              -I src/gui/qt6-qml/cpp \
              "tests/kibitzer/test_${t}.cpp" -o "/tmp/kibitzer-${t}"
            "/tmp/kibitzer-${t}"
          done
      - name: Regression test offline evidence report
        run: python3 -m unittest discover -s tests/kibitzer -p test_evidence_report.py -v
      - name: Compile and run board, inference and P0 strategy regressions
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -I src/gui/qt6-qml/cpp -I src/engine/local_engine \
            tests/kibitzer/test_strategy_p0.cpp src/engine/local_engine/handevaluator.cpp \
            -o /tmp/kibitzer-p0
          /tmp/kibitzer-p0

      - name: Compile and run V8 empirical model and pot-tier regressions
        run: |
          set -eu
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -I src/gui/qt6-qml/cpp -I src/engine/local_engine \
            tests/kibitzer/test_empirical_v8.cpp src/engine/local_engine/handevaluator.cpp \
            -o /tmp/kibitzer-v8
          /tmp/kibitzer-v8

  export-range:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install host Qt Core development headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-base-dev
      - name: Compile and run time range selection regressions
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -fPIC \
            -I src/gui/qt6-qml/cpp tests/kibitzer/test_export_range.cpp \
            $(pkg-config --cflags --libs Qt6Core) -o /tmp/kibitzer-export-range
          /tmp/kibitzer-export-range
